spring.application.name=MyOrgChart
# Database Configuration
# Non-development runtimes must provide datasource settings explicitly.
# The development-only local database defaults live in application-dev.properties.
# Set these env vars outside the repo before starting the app:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Connection Pool Settings for HikariCP
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

#logging
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.engine.jdbc=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG


# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Server Port (Optional)
server.port=8080

# Account verification email configuration
# Set APP_EMAIL_FROM_ADDRESS to a verified SES sender identity.
# Optionally set APP_EMAIL_CONFIGURATION_SET to the SES configuration set name.
app.email.from-address=${APP_EMAIL_FROM_ADDRESS:}
app.email.configuration-set=${APP_EMAIL_CONFIGURATION_SET:}
