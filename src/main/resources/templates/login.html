<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Log In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h1 class="text-center mb-4">Log In</h1>

  <div class="alert alert-info" role="alert">
    <strong>Optional private account:</strong>
    <div>Logging in is only for private-account features such as email verification and later account-managed membership controls.</div>
    <div>The normal free org-chart self-entry flow still works without logging in.</div>
  </div>

  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

  <div class="card shadow-lg p-4">
    <form action="/account/login" method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" th:value="${email}" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Log In</button>
      </div>
    </form>
  </div>

  <div class="text-center mt-4">
    <a href="/register" class="btn btn-outline-primary me-2">Create Private Account</a>
    <a href="/" class="btn btn-secondary">Back to Home</a>
  </div>
</div>
</body>
</html>
