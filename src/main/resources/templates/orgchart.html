<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Organization Chart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* Tree View Styles */
    ul.tree, ul.tree ul {
      list-style-type: none;
      padding-left: 20px;
      position: relative;
    }
    ul.tree ul {
      margin-left: 20px;
    }
    ul.tree li {
      margin: 0;
      padding: 10px 5px 0 5px;
      position: relative;
    }
    ul.tree li:before {
      content: '';
      display: block;
      width: 10px;
      height: 0;
      border-top: 1px solid #ccc;
      margin-top: -1px;
      position: absolute;
      top: 20px;
      left: -10px;
    }
    ul.tree li:last-child:before {
      background: white;
      height: auto;
      top: 20px;
      bottom: 0;
    }
  </style>
</head>
<body class="bg-light">
<div class="container mt-5">
  <h1 class="text-center mb-4">Organization Chart</h1>

  <div class="alert alert-info" role="alert">
    <strong>Instructions:</strong>
    <div>Enter an organization domain that already exists in the system.</div>
    <div>The chart will show people grouped by their supervisor relationships.</div>
    <div>If no people have been added yet, the chart may appear empty.</div>
  </div>

  <!-- Form to Enter Organization Domain -->
  <form id="orgchart-form" class="mb-4">
    <div class="input-group">
      <input type="text" class="form-control" id="domain" name="domain" placeholder="Enter organization domain" required>
      <button type="submit" class="btn btn-primary">See Org Chart</button>
    </div>
  </form>

  <!-- Error Message -->
  <div id="error-message" class="alert alert-danger" style="display: none;"></div>
  <div id="info-message" class="alert alert-info" style="display: none;"></div>

  <!-- Tree View Container -->
  <div class="card shadow-lg p-4">
    <ul class="tree" id="orgchart-tree"></ul>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-secondary">Back to Home</a>
  </div>
</div>

<script>
  document.getElementById("orgchart-form").addEventListener("submit", function(event) {
    event.preventDefault();
    const domain = document.getElementById("domain").value;
    fetch(`/api/orgchart?domain=${domain}`)
      .then(response => {
        if (!response.ok) {
          return response.json().then(data => { throw new Error(data.error); });
        }
        return response.json();
      })
      .then(data => {
        document.getElementById("error-message").style.display = "none";
        document.getElementById("info-message").style.display = "none";
        const treeContainer = document.getElementById("orgchart-tree");
        treeContainer.innerHTML = "";

        if (!data || data.length === 0) {
          document.getElementById("info-message").style.display = "block";
          document.getElementById("info-message").textContent =
            `Organization '${domain}' exists, but no people have been added yet.`;
          return;
        }

        buildTree(treeContainer, data);
      })
      .catch(error => {
        document.getElementById("info-message").style.display = "none";
        document.getElementById("orgchart-tree").innerHTML = "";
        document.getElementById("error-message").style.display = "block";
        document.getElementById("error-message").textContent = error.message;
      });
  });

  function buildTree(container, nodes) {
    nodes.forEach(node => {
      const li = document.createElement("li");
      li.innerHTML = `
            <strong>${node.name}</strong>
            <span>(${node.department})</span>
            <span>${node.email}</span>`;
      container.appendChild(li);

      if (node.children && node.children.length > 0) {
        const ul = document.createElement("ul");
        li.appendChild(ul);
        buildTree(ul, node.children);
      }
    });
  }

</script>
</body>
</html>
