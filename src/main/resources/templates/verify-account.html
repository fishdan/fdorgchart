<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Verify Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h1 class="text-center mb-4">Verify Your Email</h1>

  <div class="alert alert-info" role="alert">
    <strong>Verification address:</strong>
    <span th:text="${accountEmail}"></span>
  </div>

  <div th:if="${sent}" class="alert alert-success" role="alert">
    Verification code sent. Check your email for the six-digit code.
  </div>

  <div th:if="${login}" class="alert alert-warning" role="alert">
    Your account is not verified yet. Enter the code below or request a new code.
  </div>

  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

  <div class="card shadow-lg p-4 mb-4">
    <form action="/account/verification/confirm" method="post">
      <div class="mb-3">
        <label for="code" class="form-label">Verification Code</label>
        <input type="text" id="code" name="code" class="form-control" maxlength="6" required>
        <div class="form-text">Codes expire after 15 minutes.</div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Verify Email</button>
      </div>
    </form>
  </div>

  <div class="card shadow-lg p-4">
    <form action="/account/verification/send" method="post">
      <div class="d-grid">
        <button type="submit" class="btn btn-outline-primary btn-lg">Send New Code</button>
      </div>
      <div class="form-text mt-2">You can request a new code every 5 minutes, up to 5 sends in 24 hours.</div>
    </form>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="btn btn-secondary">Back to Home</a>
  </div>
</div>
</body>
</html>
